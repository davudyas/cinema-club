<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Cinema Club — Play a movie game, then talk films</title>
  <meta name="description" content="Get matched with a random film fan, play a quick movie mini-game, and the winner picks two question cards to start the conversation." />
  <meta name="theme-color" content="#F4EEE2" />
  <script>
    // set the theme before first paint: saved choice, else the device setting
    (function () {
      var t = null;
      try { t = localStorage.getItem('cinemaclub:theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#121014' : '#F4EEE2';
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cinema Club" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='22' width='52' height='36' rx='6' fill='%2317140F'/%3E%3Cpath d='M6 14l50-8 2 12-50 8z' fill='%23E0412F'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
